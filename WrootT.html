<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroot</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --surface-2:#F6F8F2; --ink:#13241C; --muted:#5A6A61; --line:#DAE1D5;
  --brand:#0F5441; --on-brand:#F0F8F2; --sprout:#B7E05A;
  --pos:#167A52; --warn:#A96A00; --warn-bg:#FBF0D8; --crit:#BE3A29; --on-crit:#FFFFFF; --crit-bg:#FBE6E1; --ok-bg:#E3F1E7;
  --rail:#0C3A2D; --rail-ink:#E3EEE6; --rail-muted:#8DB09F; --rail-line:#1C4F3F;
  --k1:#1B7F56; --k2:#C98A0B; --k3:#2F6FB3; --k4:#8A4FA8; --k5:#D2553F;
  --shadow:0 1px 2px rgba(19,36,28,.06), 0 8px 24px -16px rgba(19,36,28,.18);
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1713; --surface:#14211B; --surface-2:#1A2A22; --ink:#E6EEE8; --muted:#93A59B; --line:#273B31;
    --brand:#4FBF8F; --on-brand:#06231A; --sprout:#C3E96B;
    --pos:#5FD0A0; --warn:#E6B450; --warn-bg:#3A2E12; --crit:#F08571; --on-crit:#2B0D08; --crit-bg:#3D1D17; --ok-bg:#173326;
    --rail:#09110E; --rail-ink:#DCE8E0; --rail-muted:#7F998C; --rail-line:#1A2A22;
    --k1:#5FD0A0; --k2:#E6B450; --k3:#6FA8E6; --k4:#B98AD6; --k5:#EE8672;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1713; --surface:#14211B; --surface-2:#1A2A22; --ink:#E6EEE8; --muted:#93A59B; --line:#273B31;
  --brand:#4FBF8F; --on-brand:#06231A; --sprout:#C3E96B;
  --pos:#5FD0A0; --warn:#E6B450; --warn-bg:#3A2E12; --crit:#F08571; --on-crit:#2B0D08; --crit-bg:#3D1D17; --ok-bg:#173326;
  --rail:#09110E; --rail-ink:#DCE8E0; --rail-muted:#7F998C; --rail-line:#1A2A22;
  --k1:#5FD0A0; --k2:#E6B450; --k3:#6FA8E6; --k4:#B98AD6; --k5:#EE8672;
  --shadow:none;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos)}
.neg{color:var(--crit)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{flex:none}
[hidden]{display:none!important}

body.locked .app{display:none}
body:not(.locked) .auth{display:none}
.auth{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);overflow-y:auto}
.auth-brand{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px 56px}
.auth-brand .logo{font-size:44px;padding:0;gap:10px}
.auth-tag{font-family:var(--font-display);font-size:36px;font-weight:700;line-height:1.08;letter-spacing:-.02em;text-wrap:balance;max-width:14ch}
.auth-sub{color:var(--rail-muted);max-width:34ch}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.auth-form h1{font-size:30px;font-weight:700;line-height:1.1}
.auth-form input{padding:10px 12px}
.auth-submit{padding:11px 14px;font-size:15px;margin-top:2px}
.auth-switch{font-size:14px;color:var(--muted)}
.auth-switch button{background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline}
@media (max-width:760px){
  .auth{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .auth-brand{padding:26px 20px;gap:8px}
  .auth-brand .logo{font-size:30px}
  .auth-brand .logo svg{width:30px;height:30px}
  .auth-tag{font-size:22px;max-width:none}
  .auth-sub{display:none}
  .auth-panel{align-items:flex-start;padding:24px 20px 32px}
}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:28px;padding:22px 14px 18px;overflow-y:auto;border-right:1px solid var(--rail-line)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;padding:0 8px}
.logo svg{color:var(--sprout)}
.logo-sm{display:none}
.rail-nav{display:flex;flex-direction:column;gap:4px}
.rail-nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--rail-muted);font-weight:600}
.rail-nav a:hover{color:var(--rail-ink);background:var(--rail-line)}
.rail-nav a.on{color:var(--rail);background:var(--sprout)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:14px 10px 0;border-top:1px solid var(--rail-line)}
.rail-foot .eyebrow{color:var(--rail-muted)}
.rail-net{font-family:var(--font-display);font-size:22px;font-weight:700;overflow-wrap:anywhere}
.rail-user{display:flex;flex-direction:column;font-size:13px;line-height:1.35;margin-top:8px;overflow-wrap:anywhere}
.rail-user span{color:var(--rail-muted);font-size:12px}
.rail-btn{margin-top:6px;background:none;border:1px solid var(--rail-line);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;color:var(--rail-ink);cursor:pointer;text-align:left}
.rail-btn:hover{border-color:var(--rail-muted)}

.main{overflow-y:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-title{display:flex;align-items:center;gap:10px;min-width:0}
.topbar h1{font-size:24px;font-weight:700;line-height:1.15}
.topbar .muted{font-size:13px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:none}
#view{padding:22px 28px 40px;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.tabbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:var(--on-crit)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--surface-2)}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn.plain{border-color:transparent;background:none;width:30px;height:30px;color:var(--muted)}
.icon-btn.plain:hover{color:var(--ink);background:var(--surface-2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--on-crit);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--pos)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
input:hover,select:hover{border-color:var(--muted)}
input[type=range]{padding:0;border:0;accent-color:var(--brand);background:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
.seg label{position:relative;text-align:center;padding:7px 8px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.seg label:has(input:focus-visible){outline:2px solid var(--brand)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.card-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.section-title h2{font-size:21px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.note{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);padding-top:6px}
.foot button{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;font-size:12px;text-decoration:underline}
.hero{padding:20px 22px 18px}
.roots{display:grid;grid-template-columns:minmax(250px,330px) minmax(70px,1fr) auto;align-items:center}
.srcs{display:flex;flex-direction:column}
.src{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;height:52px;padding-right:10px}
.chip{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px}
.src-name{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.src-name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-name small{font-size:12px;color:var(--muted)}
.src-amt{font-weight:600;font-size:14px}
.src-share{display:none}
.flow{align-self:stretch;min-width:0}
.flow svg{display:block}
.root{opacity:.78}
.trunk{fill:var(--ink)}
.total{padding-left:22px;max-width:360px;min-width:0}
.bignum{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.03em;margin:4px 0 8px;overflow-wrap:anywhere}
.total .muted b{color:var(--ink)}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0;overflow:hidden}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .val{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.rows > li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows > li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rows .grow b{font-weight:600;overflow-wrap:anywhere}
.rows .grow small{font-size:12px;color:var(--muted)}
.rows .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.rows .amt{font-weight:600}
.rows .acts{display:flex;gap:2px;flex:none;align-items:center}
.tx{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .when{font-size:13px;color:var(--muted)}
.tx .what{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.tx .what b{font-weight:600;overflow-wrap:anywhere}
.tx .what small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tx .amt{font-weight:600;text-align:right;white-space:nowrap}
.tx .amt.int{color:var(--muted)}
.tx .acts{display:flex;gap:2px;width:62px;justify-content:flex-end}
.txs.compact .tx{grid-template-columns:62px minmax(0,1fr) auto}
.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.4fr);gap:10px}
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:2px;font-size:14px}
.summary b{font-family:var(--font-display);font-size:16px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.bars .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bars .track i{display:block;height:100%;width:var(--p);background:var(--brand);border-radius:4px}
.bars small{color:var(--muted)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.goal{display:flex;flex-direction:column;gap:10px}
.goal h3{font-size:17px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:var(--p);background:var(--brand);border-radius:5px}
.progress.done i{background:var(--pos)}
.goal-nums{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.goal-nums b{font-family:var(--font-display);font-size:19px}
.goal .acts{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
.goal .acts .sp{flex:1}
.mini-goal{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.mini-goal:first-child{border-top:0;padding-top:0}
.mini-goal div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.mini-goal b{min-width:0;overflow-wrap:anywhere}
.mini-goal .progress{height:7px}
.rem-form{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:8px;margin-bottom:6px}
.rem.done b{text-decoration:line-through;color:var(--muted)}
.alloc{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:4px 0 14px}
.alloc i{display:block;background:var(--c);min-width:3px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.legend li span:nth-child(2){flex:1}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal;min-width:150px}
td:last-child,th:last-child{padding-right:0}
td small{display:block;color:var(--muted);font-size:12px}
.sim{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:24px;align-items:start}
.sim-form{display:flex;flex-direction:column;gap:12px}
.sim-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
.sim-nums div{display:flex;flex-direction:column;gap:1px;min-width:0}
.sim-nums b{font-family:var(--font-display);font-size:22px;letter-spacing:-.02em;overflow-wrap:anywhere}
.sim-nums small{font-size:12px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:16px;height:0;border-top:2px solid var(--brand)}
.keys i.dash{border-top-style:dashed;border-color:var(--muted)}
.keys i.fill{height:10px;border:0;background:var(--line);border-radius:2px}
.keys i.sq{height:10px;width:10px;border:0;border-radius:2px;background:var(--brand)}
.keys i.sq.exp{background:var(--k2)}
[data-chart]{min-width:0}
[data-chart] svg{display:block;max-width:100%}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.axis.now{fill:var(--ink);font-weight:700}
.bar-inc{fill:var(--brand)}
.bar-exp{fill:var(--k2)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln-main{stroke:var(--brand)}
.ln-main-area{fill:var(--brand);opacity:.12}
.ln-alt{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5}
.ln-base{stroke:none}
.ln-base-area{fill:var(--line);opacity:.9}
.ln-dot{fill:var(--brand);stroke:var(--surface);stroke-width:2}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,15,.5)}
.modal-form{display:flex;flex-direction:column;gap:14px;padding:22px}
.modal-form h2{font-size:21px;font-weight:700}
.err{color:var(--crit);font-size:13px;font-weight:600}
.err:empty{display:none}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:1080px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .roots{grid-template-columns:minmax(0,1fr)}
  .flow{display:none}
  .total{order:-1;padding:0 0 14px;max-width:none}
  .src{height:auto;padding:9px 0;grid-template-columns:34px minmax(0,1fr) auto;border-top:1px solid var(--line)}
  .src-share{display:block;grid-column:2/-1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
  .src-share i{display:block;height:100%;width:var(--p);background:var(--c);border-radius:3px}
  .kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.four .kpi:nth-child(3){border-left:0}

  for (let i = 1; i <= years * 12; i++) {
    v = v * (1 + r) + monthly;
    pts.push(v);
  }
  return pts;
}
function stepMarket() {
  state.holdings.forEach(h => {
    const c = CLASSES[h.cls] || CLASSES['Acciones'];
    const z = gauss(Math.random);
    h.price = Math.max(h.price * (1 + c.drift + c.vol * z), 0.01);
    h.hist.push(h.price); if (h.hist.length > 120) h.hist.shift();
  });
}
function portHistory() {
  const n = Math.max(0, ...state.holdings.map(h => h.hist.length));
  const pts = [];
  for (let k = 0; k < n; k++) {
    pts.push(sum(state.holdings.map(h => h.units * (h.hist[k] || h.price))));
  }
  return pts;
}

  bell: '<path d="M6 16.5V11a6 6 0 1 1 12 0v5.5"/><path d="M10 20h4"/>' ,

const icon = (name, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name]}</svg>`;

const freshUi = () => ({
  route: 'resumen',
  filters: { month: todayISO().slice(0, 7), type: '', cat: '', wallet: '', q: '' },
  txLimit: 40,
  sim: { cls: 'Renta fija', p0: 1000000, monthly: 200000, rate: 9, years: 10 }
});
let ui = freshUi();

function notify(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(notify._timer);
  notify._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderIcons() {
  $('#btn-logout-top').innerHTML = icon('out');
  $('#btn-alerts').innerHTML = icon('bell');
  $('#btn-new-tx').innerHTML = `<span class="lbl-long">Registrar movimiento</span>${icon('plus')}`;
}

function renderAuth() {
  document.body.classList.add('locked');
  document.body.classList.remove('logged');
  $('#auth').hidden = false;
  $('#auth-form').reset();
  $('#auth-err').textContent = '';
}

function renderApp() {
  document.body.classList.remove('locked');
  document.body.classList.add('logged');
  $('#auth').hidden = true;
  $('#rail-net').textContent = fmt(netWorth());
  $('#rail-user').textContent = session.name || 'Usuario';
  $('#rail-mail').textContent = session.email || 'usuario@correo.com';
  $('#today').textContent = LONG.format(new Date());
  renderNav();
  renderRoute();
}

function renderNav() {
  const nav = $('#rail-nav');
  const items = [
    { id: 'resumen', label: 'Resumen' },
    { id: 'movimientos', label: 'Movimientos' },
    { id: 'metas', label: 'Metas' },
    { id: 'inversiones', label: 'Inversiones' },
    { id: 'portafolio', label: 'Portafolio' },
  ];
  nav.innerHTML = items.map(item => `<a href="#${item.id}" class="${ui.route === item.id ? 'on' : ''}">${icon('home')}<span>${item.label}</span></a>`).join('');
  const tab = $('#tabbar');
  tab.innerHTML = items.map(item => `<a href="#${item.id}" class="${ui.route === item.id ? 'on' : ''}">${icon('home')}<span>${item.label}</span></a>`).join('');
}

function renderView(html) {
  $('#view').innerHTML = html;
  $('#title').textContent = {
    resumen: 'Resumen',
    movimientos: 'Movimientos',
    metas: 'Metas',
    inversiones: 'Inversiones',
    portafolio: 'Portafolio'
  }[ui.route];
}

function renderRoute() {
  if (ui.route === 'resumen') renderView(renderSummary());
  else if (ui.route === 'movimientos') renderView(renderMovements());
  else if (ui.route === 'metas') renderView(renderGoals());
  else if (ui.route === 'inversiones') renderView(renderInvestments());
  else if (ui.route === 'portafolio') renderView(renderPortfolio());
}

function renderSummary() {
  const rows = sources();
  const total = netWorth();
  const inc = sum(state.tx.filter(t => t.type === 'ingreso').map(t => t.amount));
  const exp = sum(state.tx.filter(t => t.type === 'gasto').map(t => t.amount));
  const current = balances();
  const topWallet = rows.slice(0, 4).map(r => ({ ...r, share: total ? Math.round((r.amount / total) * 100) : 0 }));
  return `
  <section class="hero card">
    <div class="roots">
      <div class="srcs">
        ${topWallet.map(r => `
          <div class="src">
            <div class="chip" style="--c:${r.color}">${r.name.slice(0,1).toUpperCase()}</div>
            <div class="src-name"><b>${esc(r.name)}</b><small>${esc(r.kind)}</small></div>
            <div class="src-amt num">${fmt(r.amount)}</div>
            <div class="src-share"><i style="--p:${r.share}%"></i></div>
          </div>
        `).join('')}
      </div>
      <div class="flow">${icon('flow', 200)}</div>
      <div class="total">
        <p class="eyebrow">Patrimonio total</p>
        <div class="bignum num">${fmt(total)}</div>
        <p class="muted"><b>Ingresos</b> ${fmt(inc)} · <b>Gastos</b> ${fmt(exp)}</p>
        <div class="hero-acts">
          <button class="btn primary" type="button" data-action="new-tx">Registrar movimiento</button>
          <button class="btn" type="button" data-action="alerts">Ver alertas</button>
        </div>
      </div>
    </div>
  </section>
  <section class="card kpis">
    <div class="kpi"><span class="val num">${fmt(walletsTotal())}</span><small>Saldo disponible</small></div>
    <div class="kpi"><span class="val num">${fmt(goalsTotal())}</span><small>Metas apartadas</small></div>
    <div class="kpi"><span class="val num">${fmt(portValue())}</span><small>Portafolio</small></div>
  </section>
  <div class="grid2">
    <section class="card stack">
      <div class="card-head"><h2>Alertas y recordatorios</h2></div>
      ${alerts().length ? `<ul class="rows">${alerts().slice(0,4).map(a => `<li><div class="grow"><b>${esc(a.title)}</b><small>${fmtDate(a.date)}</small></div><div class="right"><span class="pill ${a.auto ? 'warn' : 'neutral'}">${a.auto ? 'Pago' : 'Recordatorio'}</span></div></li>`).join('')}</ul>` : '<div class="empty">Sin alertas próximas</div>'}
    </section>
    <section class="card stack">
      <div class="card-head"><h2>Últimos movimientos</h2></div>
      <div class="txs compact">${sortedTx().slice(0,5).map(t => `
        <div class="tx">
          <div class="when">${fmtDate(t.date)}</div>
          <div class="what"><b>${esc(t.cat)}</b><small>${esc(t.desc)}</small></div>
          <div class="amt ${t.type === 'gasto' ? 'neg' : 'pos'}">${fmtSigned(t.amount * (t.type === 'gasto' ? -1 : 1))}</div>
          <div class="acts">${icon('edit')}</div>
        </div>`).join('')}</div>
    </section>
  </div>`;
}

function renderMovements() {
  const q = ui.filters.q.toLowerCase();
  const filtered = sortedTx().filter(t => {
    const matchQ = !q || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q) || t.wallet.toLowerCase().includes(q); 
    const matchType = !ui.filters.type || t.type === ui.filters.type;
    const matchCat = !ui.filters.cat || t.cat === ui.filters.cat;
    const matchWallet = !ui.filters.wallet || t.wallet === ui.filters.wallet;
    const matchMonth = !ui.filters.month || t.date.slice(0,7) === ui.filters.month;
    return matchQ && matchType && matchCat && matchWallet && matchMonth;
  });
  return `
    <section class="card">
      <div class="card-head"><h2>Movimientos</h2><div class="acts"><button class="btn primary" data-action="new-tx">+ Movimiento</button></div></div>
      <div class="toolbar">
        <select data-filter="type"><option value="">Tipo</option><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option></select>
        <select data-filter="cat"><option value="">Categoría</option>${CATS.gasto.concat(CATS.ingreso).map(c => `<option value="${c}">${c}</option>`).join('')}</select>
        <select data-filter="wallet"><option value="">Cuenta</option>${state.wallets.map(w => `<option value="${w.id}">${w.name}</option>`).join('')}</select>
        <input type="month" data-filter="month" value="${ui.filters.month || todayISO().slice(0,7)}">
      </div>
      <div class="txs">${filtered.slice(0, ui.txLimit).map(t => `
        <div class="tx">
          <div class="when">${fmtDate(t.date)}</div>
          <div class="what"><b>${esc(t.cat)}</b><small>${esc(t.desc)} · ${walletById(t.wallet)?.name || t.wallet}</small></div>
          <div class="amt ${t.type === 'gasto' ? 'neg' : 'pos'}">${fmtSigned(t.amount * (t.type === 'gasto' ? -1 : 1))}</div>
          <div class="acts">${icon('edit')}${icon('trash')}</div>
        </div>`).join('') || '<div class="empty">Sin movimientos para estos filtros</div>'}</div>
    </section>`;
}

function renderGoals() {
  return `
  <section class="card">
    <div class="card-head"><h2>Metas</h2><div class="acts"><button class="btn primary" data-action="new-goal">Nueva meta</button></div></div>
    <div class="goals">${state.goals.map(g => {
      const pctDone = Math.min(100, (g.saved / g.target) * 100);
      return `<article class="goal"><div class="goal-top"><h3>${esc(g.name)}</h3><span class="pill ${pctDone >= 100 ? 'ok' : 'neutral'}">${pctDone >= 100 ? 'Completada' : pctDone.toFixed(0) + '%'}</span></div><div class="progress ${pctDone >= 100 ? 'done' : ''}"><i style="--p:${Math.min(100, pctDone)}%"></i></div><div class="goal-nums"><div><small>Ahorrado</small><b class="num">${fmt(g.saved)}</b></div><div><small>Meta</small><b class="num">${fmt(g.target)}</b></div></div><div class="acts"><span class="sp"></span><button class="btn sm" data-action="goal-edit">Editar</button></div></article>`;
    }).join('')}</div>
  </section>`;
}

function renderInvestments() {
  const h = state.holdings.map(item => ({ ...item, value: item.units * item.price }));
  return `
    <section class="card">
      <div class="card-head"><h2>Inversiones</h2><div class="acts"><button class="btn primary">Agregar activo</button></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Activo</th><th>Clase</th><th>Unidades</th><th>Costo</th><th>Valor</th></tr></thead>
          <tbody>${h.map(item => `<tr><td>${esc(item.name)}<small>${fmtDate(todayISO())}</small></td><td>${esc(item.cls)}</td><td>${item.units}</td><td>${fmt(item.cost)}</td><td>${fmt(item.value)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
}

function renderPortfolio() {
  return `
    <section class="card">
      <div class="card-head"><h2>Portafolio</h2></div>
      <div class="sim">
        <div class="sim-form">
          <div class="sim-nums">
            <div><b class="num">${fmt(portValue())}</b><small>Valor</small></div>
            <div><b class="num">${fmt(portCost())}</b><small>Costo</small></div>
            <div><b class="num">${fmt(portValue() - portCost())}</b><small>Ganancia</small></div>
          </div>
          <div class="keys"><span><i class="sq"></i> Valor</span><span><i class="sq exp"></i> Esperado</span></div>
        </div>
        <div data-chart></div>
      </div>
    </section>`;
}

function setupEvents() {
  document.addEventListener('click', e => {
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      const action = actionEl.dataset.action;
      if (action === 'logout') { session = null; state = null; renderAuth(); }
      if (action === 'new-tx') notify('Movimiento registrado');
      if (action === 'alerts') notify('Sin alertas críticas');
      if (action === 'reset') { state = seed(); notify('Datos reestablecidos'); renderApp(); }
      if (action === 'auth-switch') {
        const title = $('#auth-title');
        const lead = $('#auth-lead');
        const submit = $('#auth-submit');
        const switchText = $('#auth-switch-text');
        const isLogin = title.textContent.includes('Inicia');
        title.textContent = isLogin ? 'Crea tu cuenta' : 'Inicia sesión';
        lead.textContent = isLogin ? 'Regístrate para entrar a la app.' : 'Accede a tu cuenta';
        submit.textContent = isLogin ? 'Crear cuenta y entrar' : 'Iniciar sesión';
        switchText.textContent = isLogin ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
      }
    }
    const href = e.target.closest('a[href^="#"]');
    if (href) {
      e.preventDefault();
      const target = href.getAttribute('href').slice(1);
      ui.route = target;
      renderNav();
      renderRoute();
    }
  });

  $('#auth-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#auth-name').value.trim();
    const email = $('#auth-email').value.trim();
    const pass = $('#auth-pass').value.trim();
    if (!name || !email || pass.length < 6) {
      $('#auth-err').textContent = 'Completa los datos e ingresa una contraseña de al menos 6 caracteres.';
      return;
    }
    session = { name, email };
    state = seed();
    renderApp();
  });
}

renderIcons();
setupEvents();
renderAuth();
})();
</script>
